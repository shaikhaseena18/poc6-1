apiVersion: apps/v1
kind: Deployment

metadata:
  name: html-app

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: html-app

  template:
    metadata:
      labels:
        app: html-app

    spec:
      containers:
      - name: html-app

        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

        imagePullPolicy: Always

        ports:
        - containerPort: 80
